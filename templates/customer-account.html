<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>My Account | Sun Auto Centre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Sun Auto Centre" class="logo"></a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="/">Home</a><a class="nav-link" href="/products">Products</a>
                <a class="nav-link cart-link" href="/cart">Cart (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </nav>
    <main class="customer-account-section">
        <div class="container">
            <h2 class="text-center">My Account</h2>
            <div id="account-message" class="alert d-none" role="alert"></div>
            <div class="row justify-content-center"><div class="col-lg-8">
                <div class="customer-profile-card">
                    <form id="profile-form">
                        <div class="mb-3"><label class="form-label" for="profile-name">Name</label><input class="form-control" id="profile-name" maxlength="100" required></div>
                        <div class="mb-3"><label class="form-label" for="profile-phone">Mobile number</label><input class="form-control" id="profile-phone" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required></div>
                        <div class="mb-3"><label class="form-label" for="profile-address">Delivery address</label><textarea class="form-control" id="profile-address" maxlength="500" rows="3" required></textarea></div>
                        <button class="btn btn-warning" type="submit">Save profile</button>
                    </form>
                    <div class="customer-account-actions mt-4">
                        <a href="/customer-orders" class="btn btn-dark">My Orders</a>
                        <a href="/customer-returns" class="btn btn-dark">My Returns</a>
                        <button type="button" class="btn btn-danger" id="logout-button">Logout</button>
                    </div>
                </div>
            </div></div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
