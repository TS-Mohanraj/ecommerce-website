<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Account | Sun Auto Centre</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="/static/css/style.css">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">


            <!-- LOGO -->

            <a
                class="navbar-brand"
                href="/">

                <img
                    src="/static/img/logo.png"
                    alt="Sun Auto Centre Logo"
                    class="logo">

            </a>


            <!-- MOBILE MENU BUTTON -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- NAVIGATION -->

            <div
                class="collapse navbar-collapse"
                id="navbarNav">

                <ul class="navbar-nav ms-auto">


                    <!-- HOME -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/">

                            Home

                        </a>

                    </li>


                    <!-- BRANDS -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/#brands">

                            Brands

                        </a>

                    </li>


                    <!-- PRODUCTS -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/products">

                            Products

                        </a>

                    </li>


                    <!-- CONTACT -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/#contact">

                            Contact

                        </a>

                    </li>


                    <!-- CART -->

                    <li class="nav-item">

                        <a
                            class="nav-link cart-link"
                            href="/cart">

                            🛒 Cart
                            (<span id="cart-count">0</span>)

                        </a>

                    </li>


                    <!-- MY ACCOUNT -->

                    <li class="nav-item ms-2">

                        <a
                            class="btn btn-warning"
                            href="/customer-account">

                            My Account

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>

</header>



<!-- =====================================================
     CUSTOMER ACCOUNT SECTION
===================================================== -->

<section class="customer-account-section">

    <div class="container">


        <!-- PAGE TITLE -->

        <h2 class="text-center">

            My Account

        </h2>


        <div class="row justify-content-center">

            <div class="col-lg-8 col-md-10">


                <!-- CUSTOMER PROFILE CARD -->

                <div class="customer-profile-card">


                    <!-- LABEL -->

                    <span class="customer-profile-label">

                        CUSTOMER PROFILE

                    </span>


                    <!-- CUSTOMER NAME -->

                    <h4 id="customerName">

                        Loading...

                    </h4>


                    <!-- MOBILE -->

                    <p>

                        <strong>Mobile:</strong>

                        <span id="customerPhone">

                            Loading...

                        </span>

                    </p>


                    <!-- ADDRESS -->

                    <p>

                        <strong>Address:</strong>

                        <span id="customerAddress">

                            Loading...

                        </span>

                    </p>


                    <!-- ACCOUNT ACTIONS -->

                    <div class="customer-account-actions">


                        <!-- MY ORDERS -->

                        <a
                            href="/customer-orders"
                            class="btn btn-dark">

                            My Orders

                        </a>


                        <!-- MY RETURNS -->

                        <a
                            href="/customer-returns"
                            class="btn btn-dark">

                            My Returns

                        </a>


                        <!-- LOGOUT -->

                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="logoutCustomer()">

                            Logout

                        </button>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<!-- =====================================================
     CUSTOMER ACCOUNT JAVASCRIPT
===================================================== -->

<script>

    /*
    =========================================
    LOAD CUSTOMER PROFILE
    =========================================
    */

    async function loadCustomerProfile() {

        try {

            const response =
                await fetch("/api/customer/profile");


            const data =
                await response.json();


            /*
            -----------------------------------------
            CUSTOMER NOT LOGGED IN
            -----------------------------------------
            */

            if (!response.ok) {

                window.location.href =
                    "/customer-login";

                return;

            }


            /*
            -----------------------------------------
            DISPLAY CUSTOMER DETAILS
            -----------------------------------------
            */

            document.getElementById("customerName")
                .textContent = data.name;


            document.getElementById("customerPhone")
                .textContent = data.phone;


            document.getElementById("customerAddress")
                .textContent =
                data.address || "Not provided";


        }

        catch (error) {

            console.error(
                "Error loading customer profile:",
                error
            );

        }

    }



    /*
    =========================================
    CUSTOMER LOGOUT
    =========================================
    */

    async function logoutCustomer() {

        try {

            await fetch(
                "/api/customer/logout",
                {
                    method: "POST"
                }
            );


            window.location.href = "/";


        }

        catch (error) {

            console.error(
                "Logout error:",
                error
            );

        }

    }



    /*
    =========================================
    LOAD PROFILE WHEN PAGE OPENS
    =========================================
    */

    loadCustomerProfile();

</script>


</body>

</html>
