<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Admin Login | Sun Auto Centre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center"><div class="col-md-5">
            <div class="card shadow"><div class="card-body p-4">
                <h1 class="h3 text-center mb-4">Administrator Login</h1>
                <form id="admin-login-form">
                    <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" autocomplete="username" required></div>
                    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
                    <button class="btn btn-warning w-100" type="submit">Log in</button>
                </form>
                <div id="admin-login-message" class="alert d-none mt-3" role="alert"></div>
                <p class="small text-muted mt-3 mb-0">First-time setup: run <code>flask --app app create-admin</code> in the project folder.</p>
                <a class="d-block text-center mt-3" href="/">Return to Sun Auto Centre</a>
            </div></div>
        </div></div>
    </main>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
