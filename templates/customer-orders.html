<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Orders | Sun Auto Centre</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="/static/css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">


            <!-- LOGO -->

            <a
                class="navbar-brand"
                href="/">

                <img
                    src="/static/img/logo.png"
                    alt="Sun Auto Centre Logo"
                    class="logo">

            </a>


            <!-- MOBILE BUTTON -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- NAVIGATION -->

            <div
                class="collapse navbar-collapse"
                id="navbarNav">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="/products">

                            Products

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link cart-link"
                            href="/cart">

                            🛒 Cart
                            (<span id="cart-count">0</span>)

                        </a>

                    </li>


                    <li class="nav-item ms-2">

                        <a
                            class="btn btn-warning"
                            href="/customer-account">

                            My Account

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>

</header>



<!-- ================= ORDERS SECTION ================= -->

<section class="customer-account-section">

    <div class="container">


        <!-- TITLE -->

        <h2 class="text-center">

            My Orders

        </h2>


        <!-- ORDERS -->

        <div
            id="orders-container"
            class="row g-4">

            <div class="col-12 text-center">

                <p>

                    Loading orders...

                </p>

            </div>

        </div>

    </div>

</section>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================= ORDERS JS ================= -->

<script>

async function loadOrders() {

    try {

        const response =
            await fetch("/api/customer/orders");


        const orders =
            await response.json();


        /* =========================
           LOGIN CHECK
        ========================= */

        if (!response.ok) {

            window.location.href =
                "/customer-login";

            return;

        }


        const container =
            document.getElementById(
                "orders-container"
            );


        container.innerHTML = "";


        /* =========================
           NO ORDERS
        ========================= */

        if (orders.length === 0) {

            container.innerHTML = `

                <div class="col-12 text-center">

                    <div class="customer-profile-card">

                        <span class="customer-profile-label">
                            ORDERS
                        </span>

                        <h4>
                            No Orders Yet
                        </h4>

                        <p>
                            You have not placed any orders yet.
                        </p>

                        <a
                            href="/products"
                            class="btn btn-dark">

                            Browse Products

                        </a>

                    </div>

                </div>

            `;

            return;

        }


        /* =========================
           DISPLAY ORDERS
        ========================= */

        orders.forEach(order => {

            let itemsHTML = "";


            /* =========================
               ORDER ITEMS
            ========================= */

            if (order.items && order.items.length > 0) {

                order.items.forEach(item => {

                    itemsHTML += `

                        <div
                            class="border-bottom pb-3 mb-3">

                            <p class="mb-1">

                                <strong>
                                    ${item.product_name}
                                </strong>

                            </p>


                            <p class="mb-1">

                                <strong>
                                    Quantity:
                                </strong>

                                ${item.quantity}

                            </p>


                            <p class="mb-0">

                                <strong>
                                    Price:
                                </strong>

                                ₹${item.price}

                            </p>

                        </div>

                    `;

                });

            }
            else {

                itemsHTML = `

                    <p class="text-muted">

                        No product details available.

                    </p>

                `;

            }


            /* =========================
               ORDER CARD
            ========================= */

            container.innerHTML += `

                <div class="col-lg-6 col-md-12">

                    <div class="customer-profile-card">


                        <!-- ORDER NUMBER -->

                        <span
                            class="customer-profile-label">

                            ORDER #${order.id}

                        </span>


                        <!-- TOTAL -->

                        <h4>

                            ₹${order.total}

                        </h4>


                        <!-- STATUS -->

                        <p>

                            <strong>
                                Status:
                            </strong>

                            ${order.status}

                        </p>


                        <!-- DATE -->

                        <p>

                            <strong>
                                Date:
                            </strong>

                            ${order.order_date}

                        </p>
                          
                        <hr>

<button
    type="button"
    class="btn btn-dark"
    onclick="requestReturn(${order.id})">

    Return Order

</button>

                        <hr>


                        <!-- PRODUCTS -->

                        <h5 class="mb-3">

                            Ordered Products

                        </h5>


                        ${itemsHTML}


                    </div>

                </div>

            `;

        });

    }

    catch (error) {

        console.error(
            "Error loading orders:",
            error
        );


        document.getElementById(
            "orders-container"
        ).innerHTML = `

            <div class="col-12 text-center">

                <div class="customer-profile-card">

                    <h4>
                        Unable to Load Orders
                    </h4>

                    <p>
                        Please try again later.
                    </p>

                </div>

            </div>

        `;

    }

}

async function requestReturn(orderId) {

    const reason = prompt(
        "Please enter the reason for returning this order:"
    );


    if (!reason || reason.trim() === "") {

        return;

    }


    try {

        const response = await fetch(
            "/api/customer/returns",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    order_id: orderId,
                    reason: reason.trim()
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(data.message);

            return;

        }


        alert(
            "Return request submitted successfully!"
        );


        window.location.href =
            "/customer-returns";

    }

    catch (error) {

        console.error(
            "Return request error:",
            error
        );


        alert(
            "Unable to submit return request."
        );

    }

}

/* =========================
   LOAD ORDERS
========================= */

loadOrders();

</script>


</body>

</html>
